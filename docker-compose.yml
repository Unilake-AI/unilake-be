name: unilake-backend

services:
  # ============================================================================
  # 1. Cơ sở dữ liệu PostgreSQL (dữ liệu có cấu trúc và cơ sở dữ liệu ứng dụng)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: unilake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-unilake}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unilake}
      POSTGRES_DB: ${DB_NAME:-unilake}
      DB_READONLY_USER: ${DB_READONLY_USER:-unilake_reader}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-unilake_reader}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DB_SOURCE_NAME: ${DB_SOURCE_NAME:-unilake_source}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/seed:/opt/seed/scripts:ro
      - ./docs/data-schema:/opt/seed/ddl:ro
      - ./data/samples:/opt/seed/data:ro
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unilake} -d ${DB_NAME:-unilake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. Kho đối tượng MinIO (dữ liệu thô và data lake Bronze/Silver/Gold)
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: unilake-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2b. Tự động khởi tạo bucket MinIO (Bronze, Silver, Gold)
  # ============================================================================
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: unilake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      SILVER: ${MINIO_BUCKET_SILVER:-silver}
      GOLD: ${MINIO_BUCKET_GOLD:-gold}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$BRONZE local/$$SILVER local/$$GOLD && mc version enable local/$$BRONZE && mc ls local"
    restart: "no"
    networks:
      - unilake-network

  # ============================================================================
  # 3. Bộ nhớ đệm và hàng đợi tác vụ Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: unilake-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. Dịch vụ backend (FastAPI và bộ xử lý DuckDB)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unilake-backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app

    # Chỉ nạp SA đọc Bronze/nguồn; không cấp writer hoặc credentials root cho web.
    env_file:
      - path: .env.bronze-backend.local
        required: false
      - path: .env.silver-backend.local
        required: false

    environment: &backend-environment
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-unilake}
      - DB_PASSWORD=${DB_PASSWORD:-unilake}
      - DB_NAME=${DB_NAME:-unilake}
      - DB_READONLY_USER=${DB_READONLY_USER:-unilake_reader}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD:-unilake_reader}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_BUCKET_BRONZE=${MINIO_BUCKET_BRONZE:-bronze}
      - MINIO_BUCKET_SILVER=${MINIO_BUCKET_SILVER:-silver}
      - MINIO_BUCKET_GOLD=${MINIO_BUCKET_GOLD:-gold}
      - DUCKDB_PATH=${DUCKDB_PATH:-:memory:}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-4}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-2GB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
    networks:
      - unilake-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ============================================================================
  # 5. Worker ingestion bền vững (hàng đợi PostgreSQL → Bronze)
  # ============================================================================
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-worker.txt
    restart: unless-stopped
    command: python -m app.ingestion_worker
    environment: *backend-environment
    # Writer và verifier tách client; worker vẫn là cùng một process có hai quyền.
    env_file:
      - path: .env.bronze-worker.local
        required: false
    volumes:
      - .:/app
      - ./data:/data:ro
    networks:
      - unilake-network
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

# ============================================================================
# Mạng và volume lưu trữ bền vững
# ============================================================================
networks:
  unilake-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
