[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "unilake-ai"
version = "1.0.0"
description = "UniLake AI - Multi-source Data Lake Platform"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "langchain>=1.3.18",
    "duckdb>=1.1",
    "minio>=7.2",
    "great-expectations>=1.22.0",
    "deltalake>=1.0",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "sqlglot>=25",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.3", "langchain-anthropic>=0.3"]
ingest-docs = ["pdfplumber>=0.11", "python-docx>=1.1"]
ocr = ["pillow>=10", "pytesseract>=0.3"]
dev = [
    "jsonschema>=4.18,<5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyright>=1.1.414",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "commitlint>=1.0",
]

[project.scripts]
unilake-migrate = "alembic.config:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
    "C4",
    "PT",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Hook mypy dùng môi trường riêng; các thư viện runtime này chưa có stub đầy đủ.
# Bao gồm submodule để import minio.credentials hoặc pyarrow.parquet được xử lý cùng cách.
module = [
    "duckdb",
    "minio",
    "minio.*",
    "openpyxl",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
]
follow_imports = "skip"



[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
asyncio_mode = "auto"
