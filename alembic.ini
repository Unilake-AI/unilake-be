# UniLake AI - Cấu hình Alembic

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://unilake:unilake@localhost:5432/unilake

[post_write_hooks]
hooks = ruff-format,ruff-lint

[post_write_hooks.ruff-format]
type = console_scripts
entrypoint = ruff
options = format REVISION_SCRIPT_FILENAME

[post_write_hooks.ruff-lint]
type = console_scripts
entrypoint = ruff
options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
